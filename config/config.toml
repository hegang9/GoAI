[ragModelConfig]
embeddingModel = "text-embedding-v4"
chatModelName = "qwen-turbo"
docDir = "./docs"
baseUrl = "https://dashscope.aliyuncs.com/compatible-mode/v1"
dimension = 1024
# 单个文本块最大字符数（rune），过大易超出 embedding 输入上限
chunkSize = 512
# 相邻文本块重叠字符数，维持跨块语义连续性
chunkOverlap = 64
# 检索返回的最相关文本块数量
topK = 5
# 召回结果允许的最大向量距离（COSINE，越小越相关），超出视为不相关
maxDistance = 0.6
# 是否在多轮对话中用 LLM 把追问改写为自包含检索 query
enableQueryRewrite = true
# 是否启用精排（reranker）：召回放大 → 交叉编码重排 → 截断 TopN；关闭则回到纯向量排序
rerankEnable = true
# 重排模型名称（启用精排时生效）
rerankModel = "doubao-rerank"
# 重排服务完整地址（含 path），按所选服务填写
rerankBaseUrl = "https://your-rerank-endpoint/rerank"
# 启用精排时的召回候选数（粗排放大），建议 20~50（<=0 默认 20）
recallTopK = 25
# 精排后保留的文档数（<=0 时沿用 topK）
rerankTopK = 5
# 精排最低相关分阈值（越大越相关），0 表示不按分数过滤
rerankMinScore = 0.0
# 是否启用语义切分（句向量相似度断点）：开启后仅对新上传文档生效，不迁移存量索引；关闭走递归/标题切分
enableSemanticChunking = true
# 语义断点距离分位数阈值（0-100，越大切块越少；<=0 或 >100 默认 95）
semanticBreakpointPercentile = 95.0
# 句向量滑窗每侧大小（>0 时用相邻句拼接稳定单句语义；<0 默认 1）
semanticBufferSize = 1
# 上下文增强：命中块前后各取 N 个邻居块拼接扩展上下文（0=关闭）
contextWindow = 2
# 是否在块正文首部注入「来源｜章节」块头标签（默认关闭，仅对新文档生效）
enableHeaderInjection = true
# 无显式过滤参数时，是否用 LLM 从对话解析来源文档/章节过滤意图（默认关闭）
enableFilterIntent = true

[voiceServiceConfig]
voiceServiceApiKey = "baiduApiKey"
voiceServiceSecretKey = "baiduSecretKey"

[aiModelConfig]
modelName = "qwen-turbo"
baseUrl = "https://dashscope.aliyuncs.com/compatible-mode/v1"
apiKey = "your-api-key"

[chatReplayConfig]
# 启动时预加载的最近活跃session数量上限
sessionLimit = 10
# 启动回放使用的默认模型类型；统一为 "auto"（planner 驱动的自动能力编排）
defaultModelType = "auto"

[plannerConfig]
# 是否启用 planner 检索决策；关闭时 auto 模型退化为纯生成
enabled = true
# planner 使用的轻量模型名称（可与最终回答模型不同，建议用便宜快速的模型）
modelName = "qwen-turbo"
# planner 模型 API 基础地址
baseUrl = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# planner 模型 API Key（独立于 [aiModelConfig].apiKey，支持 planner 使用不同 provider）
plannerApiKey = "your-api-key"
# planner 决策时回溯的最近消息条数上限（<=0 默认 8）
historyWindow = 8
# planner 调用超时毫秒数，超时降级为不检索（<=0 默认 1200）
timeoutMs = 1200

[mcpConfig]
# MCP Server 的 Streamable HTTP 端点；auto 模型懒连接此地址拉取工具集注入 ReAct Agent
# 为空时退化为无工具纯生成；Server 临时不可用时本次降级，下次调用自动重试
baseUrl = "http://localhost:8081/mcp"

[imageServiceConfig]
# ONNX 图像识别模型文件路径（随部署环境变化）
modelPath = "/root/models/mobilenetv2/mobilenetv2-7.onnx"
# 类别标签文件路径
labelPath = "/root/imagenet_classes.txt"
